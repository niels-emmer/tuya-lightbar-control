services:
  tuya-lightbar-control:
    build:
      context: .
      # Match the container user to the owner of the bind-mounted
      # settings.json so it stays writable. If the deploy user is not uid 1000,
      # set APP_UID/APP_GID in .env to its `id -u` / `id -g`.
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    restart: unless-stopped
    env_file: .env
    ports:
      - "8042:8000"
    volumes:
      # Persist settings (brightness, auto on/off, etc.) across restarts
      - ./settings.json:/app/settings.json
      # Expose host network stats for the network_traffic effect.
      # Without this, the container only sees its own virtual interface.
      - /proc/net:/host_proc_net:ro
    # Hardening: drop all capabilities and forbid privilege escalation.
    # A read-only root filesystem is intentionally NOT set: settings.json is a
    # single-file bind-mount the app writes in place, which a read-only root
    # would break.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # If the device is unreachable via bridge networking (e.g. running on a VPS),
    # switch to host networking so tinytuya can reach the LAN device directly:
    # network_mode: host
    # (and remove the ports mapping above when using host mode)
